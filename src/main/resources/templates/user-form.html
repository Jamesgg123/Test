<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>會員註冊表單</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 100px; }
        input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 30px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>填寫會員資料</h2>
    
    <!-- 
        th:action  : 指定表單提交的目標 URL
        th:object  : 指定此表單綁定的後端物件（與 Model 中的 key 對應）
        method="post" : 使用 POST 方法提交
    -->
    <form th:action="@{/user/save}" th:object="${user}" method="post">
        <div class="form-group">
            <label>會員編號：</label>
            <!-- 
                th:field  : 將輸入欄位與 User 物件的 id 屬性綁定
                渲染後會產生：name="id" value="..."
            -->
            <input type="text" th:field="*{id}" required placeholder="例如: U001">
        </div>
        
        <div class="form-group">
            <label>使用者姓名：</label>
            <input type="text" th:field="*{name}" required placeholder="請輸入姓名">
        </div>
        
        <div class="form-group">
            <label>電子郵件：</label>
            <input type="email" th:field="*{email}" required placeholder="example@mail.com">
        </div>
        
        <button type="submit">送出表單</button>
    </form>
    
    <br>
    <a th:href="@{/welcome}">回首頁</a>
</body>
</html>
